name: Build & Release Unser Reiseplaner

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Versionsnummer, z. B. 1.1.0'
        required: true
        default: '1.1.1'
        type: string
      release_notes:
        description: 'Kurze Beschreibung der Änderungen'
        required: false
        default: 'Update von Unser Reiseplaner'
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Quellcode laden
        uses: actions/checkout@v5

      - name: Java einrichten
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Signatur-Secrets prüfen
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || (echo "ANDROID_KEYSTORE_BASE64 fehlt" && exit 1)
          test -n "$STORE_PASSWORD" || (echo "ANDROID_KEYSTORE_PASSWORD fehlt" && exit 1)
          test -n "$KEY_ALIAS" || (echo "ANDROID_KEY_ALIAS fehlt" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "ANDROID_KEY_PASSWORD fehlt" && exit 1)

      - name: Signaturschlüssel bereitstellen
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/unser-reiseplaner-release.jks"
          chmod 600 "$RUNNER_TEMP/unser-reiseplaner-release.jks"

      - name: Versionscode festlegen
        run: echo "VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Release-APK bauen und signieren
        env:
          URP_KEYSTORE_PATH: ${{ runner.temp }}/unser-reiseplaner-release.jks
          URP_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          URP_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          URP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew clean assembleRelease \
            -PciVersionName="${{ inputs.version_name }}" \
            -PciVersionCode="$VERSION_CODE"

      - name: APK benennen
        env:
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk "release/Unser_Reiseplaner-${VERSION_NAME}.apk"

      - name: GitHub Release veröffentlichen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_NAME: ${{ inputs.version_name }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          gh release create "v${VERSION_NAME}" \
            "release/Unser_Reiseplaner-${VERSION_NAME}.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Unser Reiseplaner ${VERSION_NAME}" \
            --notes "$RELEASE_NOTES" \
            --latest
