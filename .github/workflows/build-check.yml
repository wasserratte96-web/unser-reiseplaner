name: Projekt prüfen
run-name: ${{ inputs.request_id || github.event.pull_request.head.sha || github.sha }}
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Zu prüfender Commit
        required: true
        type: string
      request_id:
        description: Eindeutige Build-Anforderung
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Angeforderten Commit prüfen
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          if [ -n "$SOURCE_SHA" ]; then
            test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          fi
      - name: Android-SDK vorbereiten
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          cmdline-tools-version: '14742923'
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: 'false'
      - name: Android-SDK prüfen
        run: |
          command -v sdkmanager
          test -n "${ANDROID_HOME:-}"
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt"
      - name: Projekt, Regressionen und Android-Build prüfen
        run: bash tools/verify.sh --android
      - name: Prüf-APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Unser-Reiseplaner-Debug-Pruefung
          path: app/build/outputs/apk/debug/app-debug.apk
